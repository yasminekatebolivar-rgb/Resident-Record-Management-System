<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRMS Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
/* ===== GLOBAL ===== */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #f4f6f8;
  overflow-x: hidden;
}

/* ===== HAMBURGER ===== */
.hamburger-container {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1200;
}

.hamburger {
  background: #1e906f;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: -260px;
  width: 260px;
  height: 100%;
  background: linear-gradient(to bottom, #1e906f, #3ac17f);
  color: white;
  transition: 0.3s ease;
  z-index: 1100;
  padding-top: 60px;
  box-shadow: 2px 0 8px rgba(0,0,0,0.25);
}

.sidebar a {
  display: block;
  padding: 15px 25px;
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.sidebar a i {
  margin-right: 10px;
}

.sidebar a:hover {
  background: rgba(255,255,255,0.15);
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  font-size: 24px;
  color: white;
  cursor: pointer;
}

/* ===== MAIN CONTENT ===== */
.main-container {
  padding: 40px 30px 30px 90px;
  max-width: 1400px;
  margin: auto;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 30px;
}

/* ===== CARDS ===== */
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

h3 { margin-top: 0; }

/* ===== FORM ===== */
form input, form select {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

form button {
  width: 100%;
  background: #1e906f;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 25px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  vertical-align: middle;
}

table th { background: #f1f1f1; }

/* ===== ACTION BUTTONS ===== */
.action-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  margin-right: 6px;
}

.edit-btn { background: #ffb74d; color: white; }
.delete-btn { background: #e57373; color: white; }

/* ===== SEARCH ===== */
#searchInput {
  width: 250px;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* ===== SECTIONS ===== */
section { display: none; }
section.active { display: block; }
</style>
</head>

<body>

<!-- HAMBURGER -->
<div class="hamburger-container">
  <button class="hamburger" onclick="openSidebar()">
    <i class="fas fa-bars"></i>
  </button>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&times;</button>

  

  <a href="#" onclick="showSection('residents')">
    <i class="fas fa-users"></i> Residents
  </a>

  <a href="#" onclick="showSection('dashboard')">
    <i class="fas fa-chart-line"></i> Dashboard
  </a>

  <a href="#" onclick="showSection('reports')">
    <i class="fas fa-file-alt"></i> Reports
  </a>

  <a href="#" onclick="showSection('settings')">
    <i class="fas fa-cog"></i> Settings
  </a>

  <a href="#" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i> Logout
  </a>
</div>

<!-- MAIN -->
<div class="main-container">



<!-- RESIDENTS -->
<section id="residentsSection" class="active">
  <div class="dashboard-grid">

    <!-- FORM -->
    <div class="card">
      <h3 id="formTitle">Add Resident</h3>
      <form id="residentForm">
        <input id="fullname" placeholder="Full Name" required>
        <input id="age" type="number" placeholder="Age" required>

        <select id="gender" required>
          <option value="">Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>

        <select id="civilStatus" required>
          <option value="">Civil Status</option>
          <option>Single</option>
          <option>Married</option>
          <option>Widowed</option>
        </select>

        <input id="contact" placeholder="Contact Number" required>
        <input id="purok" placeholder="Purok / Zone" required>
        <input id="household" placeholder="Household" required>

        <button type="submit">Save Resident</button>
      </form>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>Resident Records</h3>
        <input id="searchInput" placeholder="Search...">
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th><th>Age</th><th>Gender</th>
            <th>Status</th><th>Contact</th>
            <th>Purok</th><th>Household</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="residentTable"></tbody>
      </table>
    </div>

  </div>
</section>
  
<!-- DASHBOARD -->
<section id="dashboardSection">
  <div class="card">
    <h3>Dashboard Overview</h3>
    <p>Summary statistics will be displayed here.</p>
  </div>
</section>
  
<!-- REPORTS -->
<section id="reportsSection">
  <div class="card">
    <h3>Reports</h3>
    <p>Printable reports will be available here.</p>
  </div>
</section>

<!-- SETTINGS -->
<section id="settingsSection">
  <div class="card">
    <h3>Settings</h3>
    <p>System configuration options.</p>
  </div>
</section>

</div>

<!-- ===== FIREBASE + LOGIC ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDfuvGXliuYZqB9KFsB3DPn6GAX1HCYt3Y",
    authDomain: "resident-management-syst-15b46.firebaseapp.com",
    projectId: "resident-management-syst-15b46",
    storageBucket: "resident-management-syst-15b46.firebasestorage.app",
    messagingSenderId: "459740472804",
    appId: "1:459740472804:web:9d4c58fac471837a1153f1"
  };


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, u => { if(!u) location.href="index.html"; });

const form = residentForm;
let editId = null;

form.onsubmit = async e => {
  e.preventDefault();
  const data = {
    fullname: fullname.value,
    age: age.value,
    gender: gender.value,
    civilStatus: civilStatus.value,
    contact: contact.value,
    purok: purok.value,
    household: household.value
  };
  editId
    ? await updateDoc(doc(db,"residents",editId),data)
    : await addDoc(collection(db,"residents"),data);
  form.reset();
  editId = null;
  formTitle.innerText = "Add Resident";
};

onSnapshot(collection(db,"residents"), snap => {
  residentTable.innerHTML="";
  snap.forEach(d=>{
    const r=d.data();
    residentTable.innerHTML+=`
    <tr>
      <td>${r.fullname}</td><td>${r.age}</td><td>${r.gender}</td>
      <td>${r.civilStatus}</td><td>${r.contact}</td>
      <td>${r.purok}</td><td>${r.household}</td>
      <td>
        <button class="action-btn edit-btn" onclick='editResident("${d.id}",${JSON.stringify(r)})'>Edit</button>
        <button class="action-btn delete-btn" onclick='deleteResident("${d.id}")'>Delete</button>
      </td>
    </tr>`;
  });
});

window.editResident=(id,r)=>{
  Object.keys(r).forEach(k=>document.getElementById(k).value=r[k]);
  editId=id;
  formTitle.innerText="Edit Resident";
};

window.deleteResident=id=>{
  if(confirm("Delete resident?")) deleteDoc(doc(db,"residents",id));
};

window.logout=()=>signOut(auth).then(()=>location.href="index.html");

window.openSidebar=()=>sidebar.style.left="0";
window.closeSidebar=()=>sidebar.style.left="-260px";

window.showSection=s=>{
  document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
  document.getElementById(s+"Section").classList.add("active");
  closeSidebar();
};

searchInput.oninput=()=>{
  const f=searchInput.value.toLowerCase();
  [...residentTable.rows].forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(f)?"":"none";
  });
};
</script>

</body>
</html>
