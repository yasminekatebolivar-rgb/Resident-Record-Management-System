<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRMS Admin Dashboard</title>

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  font-family:Poppins,sans-serif;
  margin:0;
  background:#f4f6f8;
}

.hamburger-container{
  position:fixed; top:20px; left:20px; z-index:1200;
}
.hamburger{
  background:#1e906f; color:#fff; border:none;
  padding:10px 14px; border-radius:8px; font-size:20px;
}

.sidebar{
  position:fixed; top:0; left:-260px; width:260px; height:100%;
  background:linear-gradient(#1e906f,#3ac17f);
  color:#fff; transition:.3s; z-index:1100; padding-top:60px;
}
.sidebar a{
  display:block; padding:15px 25px; cursor:pointer;
}
.sidebar a:hover{background:rgba(255,255,255,.15);}
.close-btn{
  position:absolute; top:15px; right:15px;
  background:none; border:none; font-size:24px; color:#fff;
}

.main-container{
  padding:40px 30px 30px 90px;
  max-width:1400px; margin:auto;
}

.view{display:none;}
.view.active{display:block;}

.dashboard-grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:30px;
}

.card{
  background:#fff; padding:20px;
  border-radius:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.dashboard-cards{
  display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap;
}
.card-small{
  flex:1; min-width:160px;
  background:#1e906f; color:#fff;
  border-radius:12px; padding:15px; text-align:center;
}

table{width:100%; border-collapse:collapse;}
th,td{padding:12px; border-bottom:1px solid #ddd;}

input,select{
  width:100%; padding:10px; margin-bottom:12px;
  border-radius:8px; border:1px solid #ccc;
}
button{
  background:#1e906f; color:#fff; border:none;
  padding:12px; border-radius:25px; width:100%;
}

.action-btn{
  padding:6px 14px; border-radius:20px; border:none;
  font-weight:600; cursor:pointer;
}
.edit-btn{background:#ffb74d;}
.delete-btn{background:#e57373;}

.activity-card{
  background:#f1f1f1; padding:12px 15px;
  border-radius:10px; margin-bottom:10px;
  display:flex; justify-content:space-between;
}
.activity-time{font-size:12px; color:#666;}
</style>
</head>

<body>

<div class="hamburger-container">
  <button class="hamburger" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
</div>

<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&times;</button>
  <a onclick="showView('residentView')">Residents</a>
  <a onclick="showView('dashboardView')">Dashboard</a>
  <a onclick="showView('reportsView')">Reports</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main-container">

<!-- DASHBOARD -->
<div id="dashboardView" class="view">
  <h2>Dashboard</h2>

  <div class="dashboard-cards">
    <div class="card-small"><h4>Total Residents</h4><p id="dTotal">0</p></div>
    <div class="card-small"><h4>Households</h4><p id="dHouse">0</p></div>
    <div class="card-small"><h4>Male</h4><p id="dMale">0</p></div>
    <div class="card-small"><h4>Female</h4><p id="dFemale">0</p></div>
  </div>

  <div class="dashboard-grid">
    <div class="card"><h3>Age Groups</h3><canvas id="ageChart"></canvas></div>
    <div class="card"><h3>Civil Status</h3><canvas id="statusChart"></canvas></div>
  </div>

  <div class="card">
    <h3>Recent Activity</h3>
    <div id="recentActivity"></div>
  </div>
</div>

<!-- RESIDENTS (DEFAULT VIEW) -->
<div id="residentView" class="view active">
  <div class="dashboard-grid">
    <div class="card">
      <h3 id="formTitle">Add Resident</h3>
      <form id="residentForm">
        <input id="fullname" placeholder="Full Name" required>
        <input id="age" type="number" placeholder="Age" required>
        <select id="gender"><option>Male</option><option>Female</option></select>
        <select id="civilStatus"><option>Single</option><option>Married</option><option>Widowed</option></select>
        <input id="contact" placeholder="Contact">
        <input id="purok" placeholder="Purok">
        <input id="household" placeholder="Household">
        <button>Save</button>
      </form>
    </div>

    <div class="card">
      <h3>Resident Records</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Age</th><th>Gender</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="residentTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- REPORTS -->
<div id="reportsView" class="view">
  <h2>Reports & Analytics</h2>

  <div class="dashboard-grid">
    <div class="card"><h3>Residents per Purok</h3><canvas id="purokChart"></canvas></div>
    <div class="card"><h3>Gender Distribution</h3><canvas id="genderChart"></canvas></div>
  </div>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDfuvGXliuYZqB9KFsB3DPn6GAX1HCYt3Y",
  authDomain:"resident-management-syst-15b46.firebaseapp.com",
  projectId:"resident-management-syst-15b46"
});

const db = getFirestore(app);
const auth = getAuth(app);

let residents=[];
let ageChart,statusChart,purokChart,genderChart;

onSnapshot(collection(db,"residents"), snap=>{
  residents = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderResidents();
  if(document.getElementById("dashboardView").classList.contains("active")) renderDashboard();
  if(document.getElementById("reportsView").classList.contains("active")) renderReports();
});

function renderResidents(){
  const t=document.getElementById("residentTable");
  t.innerHTML="";
  residents.forEach(r=>{
    t.innerHTML+=`
    <tr>
      <td>${r.fullname}</td>
      <td>${r.age}</td>
      <td>${r.gender}</td>
      <td>${r.civilStatus}</td>
      <td>
        <button class="action-btn delete-btn" onclick="deleteResident('${r.id}')">Delete</button>
      </td>
    </tr>`;
  });
}

function renderDashboard(){
  dTotal.innerText=residents.length;
  dMale.innerText=residents.filter(r=>r.gender==="Male").length;
  dFemale.innerText=residents.filter(r=>r.gender==="Female").length;
  dHouse.innerText=[...new Set(residents.map(r=>r.household))].length;

  if(ageChart) ageChart.destroy();
  ageChart=new Chart(ageChartCanvas,{
    type:"bar",
    data:{labels:["Children","Youth","Adult","Senior"],
      datasets:[{data:[
        residents.filter(r=>r.age<=12).length,
        residents.filter(r=>r.age<=24&&r.age>=13).length,
        residents.filter(r=>r.age<=59&&r.age>=25).length,
        residents.filter(r=>r.age>=60).length
      ],backgroundColor:"#1e906f"}]},
    options:{plugins:{legend:{display:false}}}
  });
}

function renderReports(){
  const purok={};
  residents.forEach(r=>purok[r.purok]=(purok[r.purok]||0)+1);

  if(purokChart) purokChart.destroy();
  purokChart=new Chart(purokChartCanvas,{
    type:"bar",
    data:{labels:Object.keys(purok),datasets:[{data:Object.values(purok),backgroundColor:"#3ac17f"}]},
    options:{plugins:{legend:{display:false}}}
  });
}

window.showView=id=>{
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="dashboardView") renderDashboard();
  if(id==="reportsView") renderReports();
};

window.deleteResident=id=>deleteDoc(doc(db,"residents",id));
window.logout=()=>signOut(auth);
window.openSidebar=()=>sidebar.style.left="0";
window.closeSidebar=()=>sidebar.style.left="-260px";
</script>

</body>
</html>
