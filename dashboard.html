<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRMS Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #f4f6f8;
  overflow-x: hidden;
}

/* Hamburger */
.hamburger-container {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1200;
}
.hamburger {
  background: #1e906f;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  left: -260px;
  width: 260px;
  height: 100%;
  background: linear-gradient(to bottom, #1e906f, #3ac17f);
  color: white;
  transition: 0.3s;
  z-index: 1100;
  padding-top: 60px;
}
.sidebar a {
  display: block;
  padding: 15px 25px;
  color: white;
  cursor: pointer;
}
.sidebar a:hover { background: rgba(255,255,255,0.15); }

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  font-size: 24px;
  color: white;
}

.main-container {
  padding: 40px 30px 30px 90px;
  max-width: 1400px;
  margin: auto;
}

.view { display:none; }
.view.active { display:block; }

.dashboard-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 30px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.dashboard-cards {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}
.card-small {
  flex: 1;
  background: #1e906f;
  color: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

form input, form select {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

form button {
  width: 100%;
  background: #1e906f;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 25px;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
}
table th, table td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}
table th { background: #f1f1f1; }

.action-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}
.edit-btn { background: #ffb74d; color: white; }
.delete-btn { background: #e57373; color: white; }
</style>
</head>

<body>

<!-- Hamburger -->
<div class="hamburger-container">
  <button class="hamburger" onclick="openSidebar()">
    <i class="fas fa-bars"></i>
  </button>
</div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&times;</button>
  <a onclick="showView('residentView')">Residents</a>
  <a onclick="showView('dashboardView')">Dashboard</a>
  <a onclick="showView('settingsView')">Settings</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main-container">

<!-- DASHBOARD -->
<div id="dashboardView" class="view">
  <h2>Dashboard</h2>
  <div class="dashboard-cards">
    <div class="card-small"><h4>Total Residents</h4><p id="totalResidents">0</p></div>
    <div class="card-small"><h4>Total Households</h4><p id="totalHouseholds">0</p></div>
    <div class="card-small"><h4>Male</h4><p id="totalMale">0</p></div>
    <div class="card-small"><h4>Female</h4><p id="totalFemale">0</p></div>
  </div>

  <div class="dashboard-grid">
    <div class="card"><canvas id="ageChart"></canvas></div>
    <div class="card"><canvas id="statusChart"></canvas></div>
  </div>
</div>

<!-- RESIDENTS (DEFAULT) -->
<div id="residentView" class="view active">
  <div class="dashboard-grid">
    <div class="card">
      <h3>Add Resident</h3>
      <form id="residentForm">
        <input id="fullname" placeholder="Full Name" required>
        <input id="age" type="number" placeholder="Age" required>
        <select id="gender" required>
          <option value="">Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <select id="civilStatus" required>
          <option value="">Civil Status</option>
          <option>Single</option>
          <option>Married</option>
          <option>Widowed</option>
        </select>
        <input id="contact" placeholder="Contact">
        <input id="purok" placeholder="Purok">
        <input id="household" placeholder="Household">
        <button type="submit">Save Resident</button>
      </form>
    </div>

    <div class="card">
      <h3>Resident Records</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Age</th><th>Gender</th><th>Status</th>
            <th>Contact</th><th>Purok</th><th>Household</th>
          </tr>
        </thead>
        <tbody id="residentTable"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsView" class="view">
  <h2>Settings</h2>

  <div class="dashboard-grid">
    <div class="card">
      <h3>👤 Admin Account</h3>
      <input id="adminEmail" disabled>
      <input id="lastLogin" disabled>
      <input id="newPassword" type="password" placeholder="New Password">
      <button onclick="changePassword()">Change Password</button>
    </div>

    <div class="card">
      <h3>🏘️ Barangay Configuration</h3>
      <input id="barangayName" placeholder="Barangay Name">
      <input id="municipality" placeholder="Municipality">
      <input id="province" placeholder="Province">
      <input id="purokList" placeholder="Purok list (comma separated)">
      <button onclick="saveBarangay()">Save Barangay Info</button>
    </div>

    <div class="card">
      <h3>🔐 System Controls</h3>
      <button onclick="clearCache()">Clear Cache</button>
    </div>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfuvGXliuYZqB9KFsB3DPn6GAX1HCYt3Y",
  authDomain: "resident-management-syst-15b46.firebaseapp.com",
  projectId: "resident-management-syst-15b46"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user => {
  if (!user) location.href="index.html";
  adminEmail.value = user.email;
  lastLogin.value = user.metadata.lastSignInTime;
});

residentForm.addEventListener("submit", async e => {
  e.preventDefault();
  await addDoc(collection(db,"residents"), {
    fullname: fullname.value,
    age: Number(age.value),
    gender: gender.value,
    civilStatus: civilStatus.value,
    contact: contact.value,
    purok: purok.value,
    household: household.value,
    createdAt: serverTimestamp()
  });
  residentForm.reset();
});

onSnapshot(collection(db,"residents"), snap => {
  residentTable.innerHTML="";
  snap.forEach(d=>{
    const r=d.data();
    residentTable.innerHTML+=`
      <tr>
        <td>${r.fullname}</td><td>${r.age}</td><td>${r.gender}</td>
        <td>${r.civilStatus}</td><td>${r.contact}</td>
        <td>${r.purok}</td><td>${r.household}</td>
      </tr>`;
  });
});

window.saveBarangay = async ()=>{
  await setDoc(doc(db,"system","barangay"),{
    barangayName:barangayName.value,
    municipality:municipality.value,
    province:province.value,
    purokList:purokList.value.split(","),
    updatedAt:serverTimestamp()
  });
  alert("Barangay settings saved");
};

window.changePassword = async ()=>{
  await updatePassword(auth.currentUser,newPassword.value);
  alert("Password changed");
};

window.showView = id=>{
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  closeSidebar();
};

window.openSidebar = ()=>sidebar.style.left="0";
window.closeSidebar = ()=>sidebar.style.left="-260px";
window.logout = ()=>signOut(auth);
window.clearCache = ()=>{localStorage.clear();alert("Cache cleared");};
</script>

</body>
</html>
