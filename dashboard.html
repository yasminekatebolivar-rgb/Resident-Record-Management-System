<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRMS Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
/* ===== GLOBAL ===== */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #f4f6f8;
  overflow-x: hidden;
}

/* ===== HAMBURGER ===== */
.hamburger-container {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1200;
}

.hamburger {
  background: #1e906f;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: -260px;
  width: 260px;
  height: 100%;
  background: linear-gradient(to bottom, #1e906f, #3ac17f);
  color: white;
  transition: 0.3s;
  z-index: 1100;
  padding-top: 60px;
}

.sidebar a {
  display: block;
  padding: 15px 25px;
  color: white;
  text-decoration: none;
  font-weight: 500;
}

.sidebar a:hover {
  background: rgba(255,255,255,0.15);
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  font-size: 24px;
  color: white;
  cursor: pointer;
}

/* ===== MAIN ===== */
.main-container {
  padding: 40px 30px 30px 90px;
  max-width: 1400px;
  margin: auto;
}

/* ===== DASHBOARD ===== */
.dashboard-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.stat-card {
  background: white;
  border-radius: 14px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.stat-card h2 {
  margin: 0;
  color: #1e906f;
  font-size: 34px;
}

.stat-card p {
  margin-top: 8px;
  color: #555;
  font-weight: 500;
}

/* ===== RESIDENT GRID ===== */
.dashboard-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 30px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

/* ===== FORM ===== */
form input, form select {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

form button {
  width: 100%;
  background: #1e906f;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 25px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
}

table th, table td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

table th {
  background: #f1f1f1;
}

/* ===== ACTION BUTTONS ===== */
.action-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  margin-right: 6px;
}

.edit-btn { background: #ffb74d; color: white; }
.delete-btn { background: #e57373; color: white; }

/* ===== SEARCH ===== */
#searchInput {
  width: 250px;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* ===== HIDE SECTIONS ===== */
.section { display: none; }
.section.active { display: block; }
</style>
</head>

<body>

<!-- HAMBURGER -->
<div class="hamburger-container">
  <button class="hamburger" onclick="openSidebar()">
    <i class="fas fa-bars"></i>
  </button>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="closeSidebar()">&times;</button>
  <a onclick="showSection('dashboard')">Dashboard</a>
  <a onclick="showSection('residents')">Residents</a>
  <a onclick="logout()">Logout</a>
</div>

<!-- MAIN -->
<div class="main-container">

  <!-- DASHBOARD SECTION -->
  <div id="dashboard" class="section active">
    <h2>Dashboard Overview</h2>
    <div class="dashboard-cards">
      <div class="stat-card">
        <h2 id="totalResidents">0</h2>
        <p>Total Residents</p>
      </div>
      <div class="stat-card">
        <h2 id="totalHouseholds">0</h2>
        <p>Total Households</p>
      </div>
      <div class="stat-card">
        <h2 id="maleCount">0</h2>
        <p>Male</p>
      </div>
      <div class="stat-card">
        <h2 id="femaleCount">0</h2>
        <p>Female</p>
      </div>
    </div>
  </div>

  <!-- RESIDENT SECTION -->
  <div id="residents" class="section">
    <div class="dashboard-grid">

      <div class="card">
        <h3 id="formTitle">Add Resident</h3>
        <form id="residentForm">
          <input id="fullname" placeholder="Full Name" required>
          <input id="age" type="number" placeholder="Age" required>
          <select id="gender" required>
            <option value="">Gender</option>
            <option>Male</option>
            <option>Female</option>
          </select>
          <select id="civilStatus" required>
            <option value="">Civil Status</option>
            <option>Single</option>
            <option>Married</option>
            <option>Widowed</option>
          </select>
          <input id="contact" placeholder="Contact Number" required>
          <input id="purok" placeholder="Purok / Zone" required>
          <input id="household" placeholder="Household" required>
          <button type="submit">Save Resident</button>
        </form>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h3>Resident Records</h3>
          <input id="searchInput" placeholder="Search...">
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Age</th><th>Gender</th>
              <th>Status</th><th>Contact</th>
              <th>Purok</th><th>Household</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="residentTable"></tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDfuvGXliuYZqB9KFsB3DPn6GAX1HCYt3Y",
    authDomain: "resident-management-syst-15b46.firebaseapp.com",
    projectId: "resident-management-syst-15b46",
    storageBucket: "resident-management-syst-15b46.firebasestorage.app",
    messagingSenderId: "459740472804",
    appId: "1:459740472804:web:9d4c58fac471837a1153f1"
  };


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, u => { if(!u) location.href="index.html"; });

const form = document.getElementById("residentForm");
const table = document.getElementById("residentTable");
let editId=null;

onSnapshot(collection(db,"residents"), snap=>{
  table.innerHTML="";
  let male=0,female=0,households=new Set();
  document.getElementById("totalResidents").innerText=snap.size;

  snap.forEach(d=>{
    const r=d.data();
    r.gender==="Male"?male++:female++;
    households.add(r.household);
    table.innerHTML+=`
      <tr>
        <td>${r.fullname}</td><td>${r.age}</td><td>${r.gender}</td>
        <td>${r.civilStatus}</td><td>${r.contact}</td>
        <td>${r.purok}</td><td>${r.household}</td>
        <td>
          <button class="action-btn edit-btn" onclick="editResident('${d.id}',${JSON.stringify(r).replace(/"/g,'&quot;')})">Edit</button>
          <button class="action-btn delete-btn" onclick="deleteResident('${d.id}')">Delete</button>
        </td>
      </tr>`;
  });

  maleCount.innerText=male;
  femaleCount.innerText=female;
  totalHouseholds.innerText=households.size;
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const data={fullname:fullname.value,age:age.value,gender:gender.value,civilStatus:civilStatus.value,contact:contact.value,purok:purok.value,household:household.value};
  editId?await updateDoc(doc(db,"residents",editId),data):await addDoc(collection(db,"residents"),data);
  form.reset(); editId=null;
});

window.editResident=(id,r)=>{Object.keys(r).forEach(k=>document.getElementById(k).value=r[k]);editId=id;};
window.deleteResident=id=>confirm("Delete?")&&deleteDoc(doc(db,"residents",id));
window.logout=()=>signOut(auth).then(()=>location.href="index.html");

window.openSidebar=()=>sidebar.style.left="0";
window.closeSidebar=()=>sidebar.style.left="-260px";
window.showSection=s=>{document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(s).classList.add("active");closeSidebar();};

searchInput.addEventListener("input",()=>{const f=searchInput.value.toLowerCase();[...table.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(f)?"":"none");});
</script>

</body>
</html>
