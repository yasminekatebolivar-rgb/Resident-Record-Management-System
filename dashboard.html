<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRMS Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Poppins,sans-serif;margin:0;background:#f4f6f8}
.hamburger-container{position:fixed;top:20px;left:20px;z-index:1200}
.hamburger{background:#1e906f;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:20px}
.sidebar{position:fixed;top:0;left:-260px;width:260px;height:100%;background:linear-gradient(#1e906f,#3ac17f);color:#fff;transition:.3s;z-index:1100;padding-top:60px}
.sidebar a{display:block;padding:15px 25px;color:#fff;text-decoration:none;cursor:pointer}
.sidebar a:hover{background:rgba(255,255,255,.15)}
.main-container{padding:40px 30px 30px 90px;max-width:1400px;margin:auto}
.view{display:none}
.view.active{display:block}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.dashboard-cards{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.card-small{background:#1e906f;color:#fff;border-radius:12px;padding:15px;text-align:center;flex:1;min-width:150px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #ddd}
.action-btn{padding:6px 14px;border-radius:20px;border:none;color:#fff;font-weight:600}
.edit-btn{background:#ffb74d}
.delete-btn{background:#e57373}
#searchInput{width:250px;padding:10px;border-radius:20px;border:1px solid #ccc}
</style>
</head>

<body>

<div class="hamburger-container">
  <button class="hamburger" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
</div>

<div id="sidebar" class="sidebar">
  <a onclick="showView('dashboardView')">Dashboard</a>
  <a onclick="showView('residentView')">Residents</a>
  <a onclick="showView('reportsView')">Reports</a>
  <a onclick="showView('settingsView')">Settings</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main-container">

<!-- DASHBOARD -->
<div id="dashboardView" class="view">
  <h2>Dashboard</h2>
  <div class="dashboard-cards">
    <div class="card-small"><h4>Total Residents</h4><p id="totalResidents">0</p></div>
    <div class="card-small"><h4>Households</h4><p id="totalHouseholds">0</p></div>
    <div class="card-small"><h4>Male</h4><p id="totalMale">0</p></div>
    <div class="card-small"><h4>Female</h4><p id="totalFemale">0</p></div>
  </div>

  <div class="card"><canvas id="ageChart"></canvas></div>
  <br>
  <div class="card"><canvas id="statusChart"></canvas></div>
</div>

<!-- RESIDENTS -->
<div id="residentView" class="view active">
  <div class="card">
    <h3 id="formTitle">Add Resident</h3>
    <form id="residentForm">
      <input id="fullname" placeholder="Full Name" required>
      <input id="age" type="number" placeholder="Age" required>
      <select id="gender" required>
        <option value="">Gender</option><option>Male</option><option>Female</option>
      </select>
      <select id="civilStatus" required>
        <option value="">Civil Status</option>
        <option>Single</option><option>Married</option><option>Widowed</option>
      </select>
      <input id="contact" placeholder="Contact" required>
      <input id="purok" placeholder="Purok" required>
      <input id="household" placeholder="Household" required>
      <button type="submit">Save Resident</button>
    </form>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Resident Records</h3>
      <input id="searchInput" placeholder="Search...">
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Gender</th><th>Status</th>
          <th>Contact</th><th>Purok</th><th>Household</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="residentTable"></tbody>
    </table>
  </div>
</div>

<!-- REPORTS -->
<div id="reportsView" class="view">
  <h2>Reports</h2>
  <div class="card"><canvas id="purokChart"></canvas></div>
  <br>
  <div class="card"><canvas id="genderChart"></canvas></div>
</div>

<!-- SETTINGS -->
<div id="settingsView" class="view">
  <h2>Settings</h2>
  <div class="card">
    <label>Email</label>
    <input id="adminEmail" disabled>
    <label>Last Login</label>
    <input id="lastLogin" disabled>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDfuvGXliuYZqB9KFsB3DPn6GAX1HCYt3Y",
  authDomain: "resident-management-syst-15b46.firebaseapp.com",
  projectId: "resident-management-syst-15b46"
});

const auth = getAuth(app);
const db = getFirestore(app);

let residents=[], editId=null;
let ageChart,statusChart,purokChart,genderChart;

onAuthStateChanged(auth,user=>{
  if(!user) location.href="index.html";
  adminEmail.value=user.email;
  lastLogin.value=user.metadata.lastSignInTime;
});

onSnapshot(collection(db,"residents"),snap=>{
  residents=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderTable();
  renderDashboard();
  renderReports();
});

residentForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const data={fullname:fullname.value,age:+age.value,gender:gender.value,
    civilStatus:civilStatus.value,contact:contact.value,purok:purok.value,
    household:household.value,createdAt:serverTimestamp()};
  editId?await updateDoc(doc(db,"residents",editId),data):await addDoc(collection(db,"residents"),data);
  residentForm.reset(); editId=null; formTitle.innerText="Add Resident";
});

function renderTable(){
  residentTable.innerHTML="";
  residents.forEach(r=>{
    residentTable.innerHTML+=`
    <tr>
      <td>${r.fullname}</td><td>${r.age}</td><td>${r.gender}</td>
      <td>${r.civilStatus}</td><td>${r.contact}</td>
      <td>${r.purok}</td><td>${r.household}</td>
      <td>
        <button class="action-btn edit-btn" onclick="editResident('${r.id}')">Edit</button>
        <button class="action-btn delete-btn" onclick="deleteResident('${r.id}')">Delete</button>
      </td>
    </tr>`;
  });
}

function renderDashboard(){
  totalResidents.innerText=residents.length;
  totalHouseholds.innerText=new Set(residents.map(r=>r.household)).size;
  totalMale.innerText=residents.filter(r=>r.gender==="Male").length;
  totalFemale.innerText=residents.filter(r=>r.gender==="Female").length;

  ageChart?.destroy();
  ageChart=new Chart(ageChartCanvas(),{
    type:"bar",
    data:{labels:["Children","Youth","Adult","Senior"],
    datasets:[{data:[
      residents.filter(r=>r.age<=12).length,
      residents.filter(r=>r.age>=13&&r.age<=24).length,
      residents.filter(r=>r.age>=25&&r.age<=59).length,
      residents.filter(r=>r.age>=60).length
    ],backgroundColor:"#1e906f"}]}
  });

  statusChart?.destroy();
  statusChart=new Chart(statusChartCanvas(),{
    type:"bar",
    data:{labels:["Single","Married","Widowed"],
    datasets:[{data:[
      residents.filter(r=>r.civilStatus==="Single").length,
      residents.filter(r=>r.civilStatus==="Married").length,
      residents.filter(r=>r.civilStatus==="Widowed").length
    ],backgroundColor:"#3ac17f"}]}
  });
}

function renderReports(){
  const purokCount={};
  residents.forEach(r=>purokCount[r.purok]=(purokCount[r.purok]||0)+1);

  purokChart?.destroy();
  purokChart=new Chart(document.getElementById("purokChart"),{
    type:"bar",
    data:{labels:Object.keys(purokCount),
    datasets:[{data:Object.values(purokCount),backgroundColor:"#1e906f"}]}
  });

  genderChart?.destroy();
  genderChart=new Chart(document.getElementById("genderChart"),{
    type:"bar",
    data:{labels:["Male","Female"],
    datasets:[{data:[
      residents.filter(r=>r.gender==="Male").length,
      residents.filter(r=>r.gender==="Female").length
    ],backgroundColor:["#1e906f","#3ac17f"]}]}
  });
}

window.editResident=id=>{
  const r=residents.find(x=>x.id===id);
  Object.keys(r).forEach(k=>document.getElementById(k)?.value=r[k]);
  editId=id; formTitle.innerText="Edit Resident";
};

window.deleteResident=id=>confirm("Delete?")&&deleteDoc(doc(db,"residents",id));
window.showView=id=>{document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");}
window.openSidebar=()=>sidebar.style.left="0";
window.logout=()=>signOut(auth).then(()=>location.href="index.html");

searchInput.addEventListener("input",()=>{[...residentTable.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(searchInput.value.toLowerCase())?"":"none")});

function ageChartCanvas(){return document.getElementById("ageChart")}
function statusChartCanvas(){return document.getElementById("statusChart")}
</script>
</body>
</html>
